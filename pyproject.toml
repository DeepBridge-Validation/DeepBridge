[tool.poetry]
name = "deepbridge"
version = "2.0.0"
description = "DeepBridge: Model Validation Toolkit for Machine Learning"
authors = ["Team DeepBridge <gustavo.haase@gmail.com>"]
readme = "README.md"
packages = [{include = "deepbridge"}]
exclude = [
    # Fase 0 da reorganizacao: removidas as entradas que apontavam para
    # diretorios inexistentes (simular_lib, academic, papers,
    # planejamento_doc, scripts) e para deepbridge/deprecated, que esta
    # sendo eliminado do pacote.
    ".claude/**",
    ".github/**",
    ".vscode/**",
    "tests/**"
]
classifiers = [
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
    "Natural Language :: Portuguese (Brazilian)",
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.12",
]


[tool.poetry.urls]
"Documentação" = "https://deepbridge.readthedocs.io/en/latest/"
"Código" = "https://github.com/DeepBridge-Validation/DeepBridge"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
typer = ">=0.9.0"
numpy = ">=1.24.0,<2.1"
pandas = ">=2.0.0,<=2.2.2"
scikit-learn = ">=1.3.0"
xgboost = ">=2.0.0"
scipy = ">=1.11.0"
rich = ">=13.0.0"
joblib = ">=1.3.0"
optuna = ">=3.0.0"
matplotlib = ">=3.7.0"
tabulate = ">=0.9.0"
seaborn = ">=0.12.0"
jinja2 = ">=3.1.0"
setuptools = ">=65.0.0"
plotly = ">=5.14.0"
statsmodels = ">=0.14.0"
# REMOVED: dask (moved to deepbridge-synthetic)
# REMOVED: pyarrow (moved to deepbridge-synthetic)
onnxruntime = ">=1.15.0"
pydantic = ">=2.0.0"
weasyprint = ">=60.0"



[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
pytest-timeout = "^2.3.1"
taskipy = "^1.14.1"
pytest-asyncio = "^1.2.0"
aif360 = "^0.6.1"
fairlearn = "^0.13.0"
mypy = "^1.19.1"
# ruff e a unica ferramenta de estilo do projeto: cobre lint (incluindo as
# regras de isort/flake8/pylint que interessam) e formatacao. blue, isort,
# flake8 e pylint foram removidos no item 7.2 da reorganizacao por
# sobreposicao.
ruff = "^0.15.0"
pre-commit = "^4.5.1"
radon = "^6.0.1"
types-requests = "^2.32.4.20260107"
types-setuptools = "^80.10.0.20260124"
types-tabulate = "^0.9.0.20241207"
types-jinja2 = "^2.11.9"


[tool.poetry.group.doc.dependencies]
mkdocs-material = "^9.6.4"
mkdocstrings = "^0.28.0"
mkdocstrings-python = "^1.15.0"
mkdocs-macros-plugin = "^1.3.7"
jinja2 = "^3.1.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
pythonpath = "."
# --doctest-modules foi REMOVIDO (item 2.7): com testpaths = ["tests"] ele so
# tentava coletar doctests dos proprios arquivos de teste, que nao tem nenhum.
# Contagem de testes identica com e sem ele (2540), e a sua presenca obrigava
# todo comando de teste do projeto a passar -o addopts="".
# --durations=10 deixa os testes mais lentos visiveis a cada execucao, para
# proteger o tempo de suite (~45-65s hoje).
addopts = "--durations=10"
# Guarda contra teste que trava (rede, loop infinito, deadlock). Generoso de
# proposito: o teste mais lento hoje esta muito abaixo disso, entao 60s so
# dispara em travamento real.
#
# Requer o plugin pytest-timeout, que esta em [tool.poetry.group.dev]. Sem ele
# instalado no ambiente, o pytest imprime "PytestConfigWarning: Unknown config
# option: timeout" em TODA execucao e a protecao fica inerte - foi o que
# aconteceu no venv de refatoracao. Se essa linha de warning aparecer,
# instale o grupo dev em vez de remover esta opcao.
timeout = 60
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.taskipy.tasks]
# O escopo cobre deepbridge/ E tests/, como o par blue+isort cobria antes
# (eles rodavam na raiz inteira). Com o escopo so em deepbridge/, o
# [tool.ruff.lint.per-file-ignores] abaixo declarava regra para "tests/*" que
# nenhuma tarefa alcancava.
lint = "ruff check deepbridge/ tests/"
format = "ruff format deepbridge/ tests/"
docs = "mkdocs serve"
# NAO existe mais "pre_test = task lint": o lint tem hoje alguns milhares de
# ocorrencias pre-existentes (UP006/UP045/F401 em massa), entao o gate nunca
# passava e o unico efeito pratico era impedir "task test" de rodar. O lint
# continua obrigatorio em "task quality", onde falhar e o comportamento
# desejado.
test = "pytest tests/ -s -x --cov=deepbridge -vv"
post_test = "coverage html"
type-check = "mypy deepbridge/"
quality = "task format && task lint && task type-check && task test"
# Nao ha tarefa "metrics": ela chamava
# desenvolvimento/qualidade/scripts/show_metrics.sh, que nao e versionado
# (desenvolvimento/* esta no .gitignore), logo quebrava em clone novo. O
# script continua no disco de quem o tem e pode ser chamado direto.

# MyPy Configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
pretty = true
# Start with relaxed mode, will enable strict in Phase 2
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
strict_equality = true

# Ignore libraries without stubs
[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "scipy.*",
    "pandas.*",
    "sklearn.*",
    "xgboost.*",
    "matplotlib.*",
    "seaborn.*",
    "plotly.*",
    "statsmodels.*",
    "dask.*",
    "optuna.*",
    "onnxruntime.*",
    "weasyprint.*",
    "aif360.*",
    "fairlearn.*",
    "joblib.*",
]
ignore_missing_imports = true

# Coverage Configuration
[tool.coverage.run]
source = ["deepbridge"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/setup.py",
    "*/deprecated/*",
]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
# Meta ao fim da reorganizacao: 60. Este numero so sobe, nunca desce:
# sempre que a cobertura real subir de forma estavel, atualize aqui.
fail_under = 42
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.json]
output = "coverage.json"

# Ruff Configuration
[tool.ruff]
line-length = 79
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    "htmlcov",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by ruff format)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["S101", "ARG001"]

[tool.ruff.format]
# O projeto era formatado por blue (= black com aspas simples). Sem isto,
# `task format` reescreveria todo o pacote de aspas simples para duplas num
# unico diff gigante.
quote-style = "single"
